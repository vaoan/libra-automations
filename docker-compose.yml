# Libra automations — n8n Community + its own Postgres.
# Same file runs on macOS (arm64) and Windows 11 (amd64, Docker Desktop + WSL2).
# Libra's Supabase is reached through host.docker.internal (dev: port 54332).
name: libra-automations

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-stable}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_WEBHOOK_URL: ${WEBHOOK_URL}
      GENERIC_TIMEZONE: America/Bogota
      TZ: America/Bogota
      N8N_RUNNERS_ENABLED: "true"
      # Receipt check fingerprints files with SHA-256 (require("crypto") in a Code node).
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168
      N8N_PUBLIC_API_DISABLED: "false"
      # Workflows read non-secret settings ($env.SMTP_FROM) from here.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      SMTP_FROM: ${SMTP_FROM}
      LIBRA_SUPABASE_URL: ${LIBRA_SUPABASE_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
    volumes:
      - n8n_data:/home/node/.n8n

  # Local inbox for dev: every email n8n sends lands here (UI on :${MAILPIT_PORT:-8025}).
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"

volumes:
  postgres_data:
  n8n_data:
